<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join PixLush</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#F2F1F9;color:#141024;margin:0;padding:32px 20px;text-align:center}
.card{max-width:420px;margin:0 auto;background:#fff;border-radius:24px;padding:28px 22px;box-shadow:0 8px 30px rgba(30,20,70,.08)}
h1{font-size:26px;margin:0 0 6px}p{color:#6E6889;line-height:1.5;margin:8px 0}
.code{font-size:34px;font-weight:800;letter-spacing:4px;background:#EBE9F5;border-radius:16px;padding:14px;margin:18px 0 6px}
.btn{display:block;margin:12px auto 0;padding:14px 18px;border-radius:999px;background:#FF3D6E;color:#fff;text-decoration:none;font-weight:700}
.btn.alt{background:#141024}small{color:#A6A1BC}</style></head><body>
<div class="card"><h1>Join PixLush</h1><p>Your friend is giving you <b>3 free AI photo edits</b>.</p>
<div class="code" id="code">------</div><p>Install PixLush, create a free account, then enter this code under <b>You → Invite friends</b>.</p>
<a class="btn" href="https://play.google.com/store/apps/details?id=app.pixlush.editor">Get it on Google Play</a>
<p><small>One code per account.</small></p></div>
<script>var m=(location.search.match(/[?&]code=([A-Za-z2-9]{6})/)||[])[1];if(m){document.getElementById('code').textContent=m.toUpperCase();}</script>
</body></html>
